#
# Reusable build + test matrix. Called by ci.yml on pull requests and by release.yml as the
# gate in front of create-release, so one definition covers both and a release can never be
# published from a commit whose tests failed.
name: Tests

on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to check out. Defaults to the triggering ref.'
        required: false
        type: string

jobs:
  # The suite's result is a function of the tracked files, so key "already tested" on the tree
  # hash — git's content hash of every path, mode and blob — rather than on the commit. A PR's
  # merge ref and the merge commit that lands on main are different commits with the identical
  # tree, so the run on the PR already covered, byte for byte, what a push-to-main run would
  # repeat. Checked against the last four merges (#113, #116, #121, #122): recomputing each PR's
  # merge tree reproduces the landed tree exactly. Squash and rebase merges land the same tree too.
  #
  # The converse is the safety property, and it is why this keys on content rather than on a green
  # tick for a SHA. If main moved under the PR, the merge yields a different tree, no marker
  # exists, and the matrix runs. The stale-base case — two PRs green apart, broken together — is
  # caught here without a separate push-to-main run existing to catch it.
  #
  # Bucketed by month because global.json and the dated runner labels get the toolchain close to
  # frozen but not to a freeze: windows-2025 and macos-26 still take monthly image refreshes that
  # can move the installed SDK set underneath the pin. A marker is trusted only within the month
  # it was written, which bounds how stale a green can be for about one extra run a month.
  check-tested:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      marker: ${{ steps.probe.outputs.marker }}
      green: ${{ steps.probe.outputs.green }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Look for a marker on this tree
        id: probe
        shell: bash
        run: |
          marker="refs/tested/$(date -u +%Y%m)/$(git rev-parse 'HEAD^{tree}')"
          echo "marker=$marker" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "$marker" >/dev/null 2>&1; then
            echo "green=true" >> "$GITHUB_OUTPUT"
            echo "::notice::These bytes already passed the full matrix ($marker) — skipping it."
          else
            echo "green=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: check-tested
    if: needs.check-tested.outputs.green != 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Linux is paused while #88 is open: the markdown preview renderer returns null there, so
        # two tests fail and nothing can merge. The linux-x64 release build is paused with it
        # rather than shipping untested — restore both together when #88 is fixed.
        #
        # Dated rather than -latest so an image rollover is a commit and not a surprise. That is
        # not hypothetical: macos-latest has already moved from macOS 15 to macOS 26 under this
        # repo, with nothing in here recording it. The label fixes the OS; global.json fixes the
        # SDK that the image would otherwise pick by "newest installed".
        os: [windows-2025, macos-26]

    runs-on: ${{ matrix.os }}

    # A budget, not just a safety net: the suite is meant to stay well inside this, and a design
    # that needs longer is a design to reconsider rather than a limit to raise. Both runners land
    # around two to four minutes today. Without it the floor is GitHub's own six hours, which is
    # what a hung test run costs when nobody is watching.
    timeout-minutes: 10

    steps:
      # This job is nothing but small-file I/O — extracting a package cache, writing build output,
      # and driving a loopback SFTP server a file at a time — which is the workload real-time
      # scanning is worst at. Safe here because the runner is ephemeral and discarded after the
      # job. Non-fatal: Tamper Protection can refuse it, and that is a reason to be slower rather
      # than to fail the build.
      - name: Disable Defender real-time scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: powershell
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      # No setup-dotnet: both runner images already ship the SDK global.json asks for, and the
      # action was downloading a second identical copy — 297MB and ~32s on Windows, where it failed
      # to notice the preinstalled one that macOS found in a second. `dotnet` is on PATH and obeys
      # global.json, which pins the 10.0.3xx band both images carry (10.0.302 on each today) rather
      # than taking whatever is newest — that was how the build silently changed SDK. An image that
      # stops shipping the band fails the build loudly, which is the point: it is a real toolchain
      # change and deserves a commit.

      # Set here rather than in a job-level env block, where the runner context does not exist.
      # runner.temp is the fast ephemeral disk on Windows (D:) rather than the C: system disk the
      # user profile lives on, and sits outside the workspace so checkout's clean can't reach it.
      - name: Put the NuGet package cache on the fast disk
        shell: bash
        run: echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages" >> "$GITHUB_ENV"

      # Restore is the single biggest cost on Windows — 57s of a 73s build step, re-fetching
      # Avalonia and Magick.NET every run. Keyed on the project files, since there are no lock
      # files; restore-keys let an unchanged-dependency run reuse the previous cache.
      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/nuget-packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # The SFTP integration tests drive a real server on a loopback port. RcloneTool fetches
      # rclone on first use and verifies it against hashes pinned in the repo, so there is
      # nothing to install and it behaves the same on all three runners — the deploy engine is
      # covered everywhere rather than skipping on Windows. Caching it keeps the download to
      # roughly once per rclone version rather than once per job.
      - name: Cache rclone
        uses: actions/cache@v5
        with:
          path: tests/tools/rclone/.cache
          key: rclone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/dir2site.Tests/RcloneTool.cs') }}

      # Without this an unreachable download would skip the integration tests, and a run covering
      # nothing would report green. Locally it stays unset so being offline is not a hard stop.
      - name: Require the SFTP integration tests to run
        run: echo "DIR2SITE_REQUIRE_SFTP_TESTS=1" >> "$GITHUB_ENV"
        shell: bash

      # Same reasoning, for the console test that only runs here: Windows is the only job that
      # covers attaching to a console and setting its code page, and every guard in that test is a
      # way for it to skip. Locally it stays unset, so an unusual runtime layout is not a hard stop.
      - name: Require the Windows console test to run
        if: runner.os == 'Windows'
        run: echo "DIR2SITE_REQUIRE_CONSOLE_TESTS=1" >> "$GITHUB_ENV"
        shell: bash

      # Opts in to the tests that read and write the real login keychain. Safe on an ephemeral
      # runner; left off locally so `dotnet test` never touches a developer's own keychain.
      - name: Allow keychain-backed tests
        if: runner.os == 'macOS'
        run: echo "DIR2SITE_TEST_KEYCHAIN=1" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build -c Release

      # --blame-hang names the test that stopped responding, which is the one thing the job timeout
      # above cannot do: a run killed by the runner leaves no logs at all, so a hang reads only as a
      # timestamp.
      #
      # It measures inactivity — time since any test last finished — so with the suite running one
      # test at a time, that is simply the slowest single test. Size it from CI and not from a
      # developer machine: the SFTP tests drive a real server and run orders of magnitude slower
      # here than locally, which is how the previous value ended up tripping on a test that was
      # merely slow. Well clear of anything real, and under the job timeout above, which stays the
      # backstop for a hang this fails to catch.
      - name: Test
        run: >-
          dotnet test -c Release --no-build --logger "console;verbosity=normal"
          --blame-hang --blame-hang-timeout 5m

  # Records the tree as green so the next caller can skip the matrix. Deliberately not an `if`:
  # `needs: test` on a matrix job resolves to success only when every leg passed, and a skipped
  # `test` skips this too — which is the behaviour wanted when the tree was already marked.
  #
  # A ref outside refs/heads and refs/tags is invisible in the tag and branch UI and is not fetched
  # by a normal clone, so the cost is one 40-byte ref per distinct tested tree and no clutter.
  #
  # Non-fatal on purpose: a pull request from a fork gets a read-only token and cannot push. Losing
  # a marker only means the next caller runs the matrix, which is what it did before this existed —
  # so the failure mode is a slow release, never an unverified one.
  mark-tested:
    needs: [check-tested, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Record the tree as tested
        continue-on-error: true
        run: git push origin "HEAD:${{ needs.check-tested.outputs.marker }}"
